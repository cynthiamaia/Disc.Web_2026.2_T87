<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Alternative Text</h2>
    <p>O atributo alt obrigatório fornece um texto alternativo para uma imagem, se o usuário
por algum motivo não puder visualizá-la (devido a uma conexão lenta, um erro no
atributo src ou se o usuário usar um leitor de tela). O valor do atributo alt deve descrever
a imagem.</p>
<img  src="/Users/moreira/Desktop/Disc.web_2026.2_T40/html.png" alt="Imagem de HTML5"
 height="345px" width="460px" >
</body>
</html>

A tag <img> também deve conter os atributos width e height, que especificam a largura
