
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interno</title>
</head>
<body>
    <script>
        function mostrarMensagem(){
                alert("Mensagem de Alerta")
                //alert() é uma função do JavaScript que exibe uma caixa de alerta no navegador.
        }
    </script>
    <button onclick="mostrarMensagem()">Clique aqui!</button>
    <!-- onclick é um atributo HTML-->
</body>
</html>
