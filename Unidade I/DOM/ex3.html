<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM (Document Object Model)</title>
    
</head>
<body>
    <button onclick="mudarCor()">Clique aqui</button>
    <script>
        function mudarCor(){
            document.body.style.backgroundColor = "red"
            //Essa é a linha que demonstra a manipulação do DOM.
        }
    </script>
</body>
</html>

<!--JavaScript + DOM → controla o comportamento e o conteúdo da página.-->
