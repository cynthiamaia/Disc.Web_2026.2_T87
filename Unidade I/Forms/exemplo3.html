<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixas de selecao</title>
</head>
<body>
    <h2>Caixas de selecao</h2>
    <p> O <strong>input type=checkbox</strong>define uma caixa de selecao:</p>
    <form action="#" method="post">
        <!--method=post-->
        <input type="checkbox" id="vehicle1" name="vehicle1" value="Bike">
        <label for="vehicle1"> Eu tenho uma bicicleta.</label><br>

        <input type="checkbox" id="vehicle2" name="vehicle2" value="Car">
        <label for="vehicle2"> Eu tenho um carro.</label><br>

         <input type="checkbox" id="vehicle3" name="vehicle3" value="Boat">
        <label for="vehicle3"> Eu tenho um barco.</label><br>

        <input type="submit" value="Enviar">
    </form>
</body>
</html>
<!--O atributo do método especifica o método HTTP a ser usado ao enviar os dados do
formulário. Os dados do formulário podem ser enviados como variáveis de URL (com
method="get") ou como pós-transação HTTP (com method="post").
O método HTTP padrão ao enviar dados de formulário é GET.
