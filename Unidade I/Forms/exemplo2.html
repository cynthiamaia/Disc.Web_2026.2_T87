<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixas de selecao</title>
</head>
<body>
    <h2>Caixas de selecao</h2>
    <p> O <strong>input type=checkbox</strong>define uma caixa de selecao:</p>
    <form action="#">
        <input type="checkbox" id="vehicle1" name="vehicle1">
        <label for="vehicle1"> Eu tenho uma bicicleta.</label><br>

        <input type="checkbox" id="vehicle2" name="vehicle2" value="Car">
        <label for="vehicle2"> Eu tenho um carro.</label><br>

         <input type="checkbox" id="vehicle3" name="vehicle3" value="Boat">
        <label for="vehicle3"> Eu tenho um barco.</label><br>

        <input type="submit" value="Enviar">
    </form>
</body>
</html>
<!--<input type="checkbox"> define uma caixa de seleção. As caixas de seleção
permitem que um usuário selecione 0 ou mais opções de um número limitado de
opções.-->
<!--<input type="submit"> define um botão para enviar os dados do formulário para-->
<!--action → Especifica para onde enviar os dados do formulário quando um formulário é enviado-->
<!--action="#" nesse exemplo significa que não estamos definindo uma página específica para receber o formulário-->
