<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botoes de opcoes</title>
</head>
<body>
    <h2>Botoes de opcoes</h2>
    <p>Escolha seu idioma da web favorito</p>
    <form>
        <input type="radio" id="html" name="fav_language" value="html">
        <label for="html">HTML</label><br>
        <input type="radio" id="css" name="fav_language" value="css">
        <label for="css">CSS</label><br>
         <input type="radio" id="javascript" name="fav_language" value="Java Script">
        <label for="javascript">JavaScript</label><br>
    </form>
</body>
</html>
<!--No radio, usamos o mesmo name porque queremos que sejam opções da mesma pergunta:-->
