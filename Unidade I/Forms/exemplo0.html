<!--Um formulário HTML é usado para coletar a entrada do usuário. A entrada do usuário geralmente é enviada a um servidor para processamento.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h2>Campos de Entrada de texto</h2>
    <form>
        <!--HTML <form> é usado para criar um formulário HTML para entrada do usuário.-->
        <label for="fname">Nome:</label><br>
        <input type="text" id="fname" name="fname" placeholder="Digite algo..."><br>
        <!--input Exibe um campo de entrada de texto de linha única-->
        <!--name = nome do dado que será enviado pelo formulário.-->
        <label for="lname">Sobrenome:</label><br>
        <!--tag <label> define um rótulo para muitos elementos de formulário.-->
        <!--O atributo "for" da tag <label> deve ser igual ao atributo id do <input> para uni-los.-->
        <input type="text" id="lname" name="lname" value="Doe"><br>
    </form>
    <p>Observe que o formualiro em si nao esta visivel</p>
</body>
</html>
<!--Pode se ter: 
<input type="radio"> Exibe um botão de opção (para selecionar uma das muitas opções)
<input type="checkbox"> Exibe uma caixa de seleção (para selecionar zero ou mais opções)
<input type="submit">Exibe um botão de envio (para enviar o formulário)
<input type="button"> Exibe um botão clicável
-->
