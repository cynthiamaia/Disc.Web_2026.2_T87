<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seletor por classe e id</title>
    <style>
        .titulo_principal { /* seletor por class */
            /*class → pode ser usada em vários elementos*/
            color: blue;
        }
        #subtitulo { /* seletor ID */
            /*O id deve ser único na página.*/
            color: red;
        }
    </style>
</head>
<body>
    <h1 class="titulo_principal">Texto 1</h1>
    <h1 class="titulo_principal"> Texto 2</h1>
    <h1 id="subtitulo">Texto 3</h1>
</body>
</html>
