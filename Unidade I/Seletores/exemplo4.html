<!DOCTYPE html>
<html>
<head>
<style>
p.center { /*seletor combinado*/
    /*"Selecione somente elementos <p> que tenham a classe center."*/
  text-align: center;
  color: red;
}
.center {
  color:blue;
}
</style>
</head>
<body>

<h1 class="center">This heading will not be affected</h1>
<p class="center">This paragraph will be red and center-aligned.</p> 

</body>
</html>
<!--Neste exemplo, apenas os elementos <p> com a classe "center" serão vermelhos e alinhados ao centro: 
-->
