<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .container {
            display: flex; 
            flex-direction: row;
            /*Por padrão, o Flexbox usa:

flex-direction: row;*/
        }
        /*Container, organize seus filhos usando as regras do Flexbox.*/

         .item {
            background: tomato;
            color: white;
            padding: 20px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
</div>
</body>
</html>
