<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout com Navegação Superior</title>

<style>

body{
    margin:0;
    height:100vh;

    display:grid; /*primeiro isso */

    grid-template-rows:60px 50px 120px auto 60px;/*primeiro isso */
    grid-template-columns:1fr 3fr;/*primeiro isso */

    grid-template-areas:
    "topo topo" /*segundo isso */
    "nav nav"
    "banner banner"
    "sidebar conteudo"
    "rodape rodape";
}

/* TOPO */
header{
    background:#b7b7b7;
    grid-area:topo; /*segundo isso */

    display:flex;
    align-items:center;
    justify-content:center;
}

/* MENU */
nav{
    background:#2c3e50;
    grid-area:nav;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:30px;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

/* BANNER */
.banner{
    background:#d9ead3;
    grid-area:banner;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* SIDEBAR */
aside{
    background:#cfe2f3;
    grid-area:sidebar;
    padding:20px;
}

/* CONTEÚDO */
main{
    background:#fff2cc;
    grid-area:conteudo;
    padding:20px;
}

/* RODAPÉ */
footer{
    background:#b7b7b7;
    grid-area:rodape;

    display:flex;
    align-items:center;
    justify-content:center;
}

</style>
</head>

<body>

<header>
Topo do Site
</header>

<nav>
<a href="#">Início</a>
<a href="#">Produtos</a>
<a href="#">Contato</a>
</nav>

<section class="banner">
<h2>Banner Principal</h2>
</section>

<aside>
<h3>Barra Lateral</h3>
<p>Links ou informações adicionais.</p>
</aside>

<main>
<h2>Conteúdo Principal</h2>
<p>Área destinada ao conteúdo do site.</p>
</main>

<footer>
Rodapé
</footer>

</body>
</html>
