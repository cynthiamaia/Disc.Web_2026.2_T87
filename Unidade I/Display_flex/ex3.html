<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*adicionamos flex, Os itens passam a ficar lado a lado,  o Flexbox, por padrão, usa: flex-direction: row;*/
        /*Temos duas direções principais: flex-direction: row (→ → →); flex-direction: column;
        (↓
        ↓
        ↓)*/
        .container {
            display: flex;
            flex-direction: column;
            border: 3px solid black;
            padding: 10px;
        }
        .item {
            background: tomato;
            color: white;
            padding: 20px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
  <div class="item">1</div>
  <div class="item">2</div>
  <div class="item">3</div>
</div>
</body>
</html>
