<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    
    .container {
        display: grid;
          grid-template-columns: 200px 200px 200px;/*definindo o tamanho das colunas do Grid. Quero 3 colunas,
           e cada uma terá exatamente 200px.*/
        
    }
     .item {
            background: tomato;
            color: white;
            padding: 20px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
</div>

</body>
</html>
