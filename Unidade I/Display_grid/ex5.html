<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*Quero montar uma estrutura de linhas e colunas.*/
      .page {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 200px 1144px;
        grid-template-rows: 80px 1fr 60px;
   
        border: 1px solid red
      }
      header {
         grid-column: 1 / 3; /*Comece na linha de grade 1 e termine na linha de grade 3.*/
            border: 1px solid red

      }
      footer {
        grid-column: 1 / 3; /* 1 / 2 Comece na linha de grade 1 e termine na linha de grade 2.*/
            border: 1px solid red
    }
    </style>
</head>
<body>
    <div class="page">
  <header>Header</header>

  <aside>Extras</aside>

  <main>Conteúdo</main>

  <footer>Footer</footer>
</div>

</body>
</html>
